# ==============================================================================
# SPHEREx Target Regions Configuration
#
# Astronomical coordinates are in degrees (J2000 epoch):
#   - ra_deg: Right Ascension (0° to 360°), like longitude on the sky
#   - dec_deg: Declination (-90° to +90°), like latitude on the sky
#   - size_arcmin: Size of the field to download in arcminutes (60 arcmin = 1 degree)
#   - max_files: Maximum number of SPHEREx image files to download for this region
#   - catalogue: Reference star catalogue to fetch (gaia_dr3 or allwise)
#
# You can freely edit coordinates, sizes, or file limits below.
# ==============================================================================

# Global download settings
settings:
  # Maximum total size of all downloads combined in Gigabytes
  max_total_size_gb: 2.0
  # Default maximum files per region
  default_max_files: 120
  # Archive release details
  release: "QR2"
  collection: "spherex_qr2"
  doi: "10.26131/IRSA652"

# Sky regions to download and cache
regions:
  - id: "north-ecliptic-pole"
    name: "North Ecliptic Pole Deep Field (NEP)"
    ra_deg: 270.3317
    dec_deg: 66.5614
    size_arcmin: 15.0
    max_files: 120
    catalogue: "gaia_dr3"
    description: "Deep survey field scanned repeatedly by SPHEREx every orbit, optimal for high S/N ice studies."

  - id: "south-ecliptic-pole"
    name: "South Ecliptic Pole Deep Field (SEP)"
    ra_deg: 90.0000
    dec_deg: -66.5614
    size_arcmin: 15.0
    max_files: 120
    catalogue: "gaia_dr3"
    description: "Southern celestial pole region observed in dense scan patterns, overlapping with deep survey programs."

  - id: "cosmos"
    name: "COSMOS Extragalactic Field"
    ra_deg: 150.1192
    dec_deg: 2.2058
    size_arcmin: 12.0
    max_files: 120
    catalogue: "allwise"
    description: "Standard extragalactic benchmark field with low interstellar extinction, excellent for galaxy SED studies."

  - id: "barnards-star"
    name: "Barnard's Star (GJ 699 / HIP 87937)"
    ra_deg: 269.452075
    dec_deg: 4.693364
    size_arcmin: 15.0
    max_files: 120
    catalogue: "gaia_dr3"
    gaia_source_ids: "4472832130942575872"
    target_identifiers: "Gaia DR3 4472832130942575872, GJ 699, HIP 87937"
    description: "Nearest single M-dwarf star (1.83 pc) with the largest known proper motion (~10.39 arcsec/yr); Gaia DR3 4472832130942575872."

  - id: "epsilon-indi"
    name: "Epsilon Indi System (ε Indi A & Ba)"
    ra_deg: 330.840208
    dec_deg: -56.785972
    size_arcmin: 18.0
    max_files: 120
    catalogue: "gaia_dr3"
    gaia_source_ids: "6412595290592307840, 6412596012146801152"
    target_identifiers: "Gaia DR3 6412595290592307840 (ε Indi A), Gaia DR3 6412596012146801152 (ε Indi Ba)"
    description: "Nearby K4.5V star ε Indi A and its wide binary T-dwarf companion ε Indi Ba (~6.7 arcmin separation); 18' field covers both components."

  - id: "wise-0855-0714"
    name: "WISE 0855-0714 (WISE J085510.83-071442.5)"
    ra_deg: 133.795129
    dec_deg: -7.245147
    size_arcmin: 15.0
    max_files: 120
    catalogue: "allwise"
    target_identifiers: "WISE J085510.83-071442.5"
    description: "Coldest known Y-type brown dwarf (~250 K at 2.28 pc); optically invisible in Gaia, matched using infrared AllWISE."

  - id: "rw-aurigae"
    name: "RW Aurigae Binary (Components A & B)"
    ra_deg: 76.956083
    dec_deg: 30.401325
    size_arcmin: 15.0
    max_files: 120
    catalogue: "gaia_dr3"
    gaia_source_ids: "156430822114424576, 156430817820015232"
    target_identifiers: "Gaia DR3 156430822114424576 (RW Aur A), Gaia DR3 156430817820015232 (RW Aur B)"
    description: "Classical T Tauri pre-main-sequence binary system in Taurus-Auriga with circumstellar dust and variable infrared emission."

  - id: "r-draconis"
    name: "R Draconis (V* R Dra)"
    ra_deg: 248.167625
    dec_deg: 66.754972
    size_arcmin: 15.0
    max_files: 120
    catalogue: "gaia_dr3"
    target_identifiers: "V* R Dra (J2000 16h 32m 40.23s +66° 45' 17.9\")"
    description: "Long-period Mira-type pulsating asymptotic giant branch star near the North Ecliptic Pole deep-survey zone."

